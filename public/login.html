<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Contacta Floor Monitor</title>
    <link rel="stylesheet" href="/css/auth.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
    <div class="auth-bg"></div>

    <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
            <div class="auth-logo-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/>
                </svg>
            </div>
            <div class="auth-logo-text">
                <span class="auth-logo-name">Floor Monitor</span>
            </div>
        </div>

        <!-- Tabs -->
        <div class="auth-tabs" role="tablist">
            <button class="auth-tab active" id="tab-login"    role="tab" onclick="switchTab('login')">Iniciar sesión</button>
            <button class="auth-tab"        id="tab-register" role="tab" onclick="switchTab('register')">Registrarse</button>
        </div>

        <!-- Alert global -->
        <div class="auth-alert" id="global-alert" role="alert"></div>

        <!-- ── Panel Login ──────────────────────────────────────── -->
        <div class="auth-panel active" id="panel-login">
            <div class="auth-heading">
                <h1>Bienvenido de vuelta</h1>
                <p>Ingresa tus credenciales para acceder al monitor</p>
            </div>

            <form class="auth-form" id="form-login" novalidate>
                <div class="auth-form-group">
                    <label class="auth-label" for="login-email">Correo electrónico</label>
                    <div class="auth-input-wrapper">
                        <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                        <input type="email" id="login-email" class="auth-input"
                               placeholder="tu@empresa.com" autocomplete="email" required>
                    </div>
                    <span class="field-error" id="login-email-err"></span>
                </div>

                <div class="auth-form-group">
                    <label class="auth-label" for="login-password">Contraseña</label>
                    <div class="auth-input-wrapper">
                        <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="login-password" class="auth-input"
                               placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="auth-input-toggle" onclick="togglePassword('login-password', this)" aria-label="Mostrar contraseña">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <span class="field-error" id="login-password-err"></span>
                </div>

                <div class="auth-forgot">
                    <a href="#" onclick="switchTab('forgot'); return false;">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="auth-btn" id="btn-login">
                    <div class="spinner"></div>
                    <span class="btn-text">Iniciar sesión</span>
                </button>
            </form>
        </div>

        <!-- ── Panel Register ───────────────────────────────────── -->
        <div class="auth-panel" id="panel-register">
            <div class="auth-heading">
                <h1>Crear cuenta</h1>
                <p>Configura tu workspace de monitoreo</p>
            </div>

            <form class="auth-form" id="form-register" novalidate>
                <div class="auth-form-group">
                    <label class="auth-label" for="reg-name">Nombre completo</label>
                    <div class="auth-input-wrapper">
                        <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="reg-name" class="auth-input"
                               placeholder="Juan Pérez" autocomplete="name" required>
                    </div>
                    <span class="field-error" id="reg-name-err"></span>
                </div>

                <div class="auth-form-group">
                    <label class="auth-label" for="reg-company">Empresa / Contact Center</label>
                    <div class="auth-input-wrapper">
                        <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        <input type="text" id="reg-company" class="auth-input"
                               placeholder="Contacta S.A." autocomplete="organization">
                    </div>
                    <span class="field-error" id="reg-company-err"></span>
                </div>

                <div class="auth-form-group">
                    <label class="auth-label" for="reg-email">Correo electrónico</label>
                    <div class="auth-input-wrapper">
                        <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                        <input type="email" id="reg-email" class="auth-input"
                               placeholder="tu@empresa.com" autocomplete="email" required>
                    </div>
                    <span class="field-error" id="reg-email-err"></span>
                </div>

                <div class="auth-form-group">
                    <label class="auth-label" for="reg-password">Contraseña</label>
                    <div class="auth-input-wrapper">
                        <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="reg-password" class="auth-input"
                               placeholder="Mínimo 8 caracteres" autocomplete="new-password" required
                               oninput="checkPasswordStrength(this.value)">
                        <button type="button" class="auth-input-toggle" onclick="togglePassword('reg-password', this)" aria-label="Mostrar contraseña">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="password-strength"><div class="password-strength-bar" id="strength-bar"></div></div>
                    <span class="field-error" id="reg-password-err"></span>
                </div>

                <button type="submit" class="auth-btn" id="btn-register">
                    <div class="spinner"></div>
                    <span class="btn-text">Crear cuenta</span>
                </button>
            </form>
        </div>

        <!-- ── Panel Forgot Password ─────────────────────────────── -->
        <div class="auth-panel" id="panel-forgot">
            <div class="auth-heading">
                <h1>Recuperar contraseña</h1>
                <p>Te enviaremos un enlace para restablecer tu contraseña</p>
            </div>

            <form class="auth-form" id="form-forgot" novalidate>
                <div class="auth-form-group">
                    <label class="auth-label" for="forgot-email">Correo electrónico</label>
                    <div class="auth-input-wrapper">
                        <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                        <input type="email" id="forgot-email" class="auth-input"
                               placeholder="tu@empresa.com" autocomplete="email" required>
                    </div>
                </div>

                <button type="submit" class="auth-btn" id="btn-forgot">
                    <div class="spinner"></div>
                    <span class="btn-text">Enviar enlace</span>
                </button>

                <div style="text-align:center; margin-top:0.75rem;">
                    <a href="#" onclick="switchTab('login'); return false;"
                       style="font-size:0.82rem; color:var(--auth-muted); text-decoration:none;">
                        ← Volver al inicio de sesión
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/auth/supabaseClient.js"></script>
    <script src="/js/auth/authService.js"></script>
    <script>
    // ── UI helpers ───────────────────────────────────────────────
    function switchTab(tab) {
        document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`panel-${tab}`).classList.add('active');
        const tabEl = document.getElementById(`tab-${tab}`);
        if (tabEl) tabEl.classList.add('active');
        hideAlert();
    }

    function showAlert(msg, type = 'error') {
        const el = document.getElementById('global-alert');
        el.className = `auth-alert show ${type}`;
        el.textContent = msg;
    }

    function hideAlert() {
        const el = document.getElementById('global-alert');
        el.className = 'auth-alert';
        el.textContent = '';
    }

    function setLoading(btnId, loading) {
        const btn = document.getElementById(btnId);
        btn.classList.toggle('loading', loading);
        btn.disabled = loading;
    }

    function showFieldError(id, msg) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = msg;
        el.classList.toggle('show', !!msg);
    }

    function clearFieldErrors(...ids) {
        ids.forEach(id => showFieldError(id, ''));
    }

    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const show  = input.type === 'password';
        input.type  = show ? 'text' : 'password';
        btn.querySelector('svg').style.opacity = show ? '0.5' : '1';
    }

    function checkPasswordStrength(val) {
        const bar = document.getElementById('strength-bar');
        if (!bar) return;
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        const pct   = (score / 4) * 100;
        const color = ['#ef4444','#f97316','#eab308','#22c55e'][score - 1] || '#2a2d3a';
        bar.style.width      = `${pct}%`;
        bar.style.background = color;
    }

    function friendlyAuthError(err) {
        const msg = err.message || '';
        if (msg.includes('Invalid login') || msg.includes('invalid_credentials'))
            return 'Correo o contraseña incorrectos';
        if (msg.includes('Email not confirmed'))
            return 'Confirma tu correo electrónico antes de iniciar sesión';
        if (msg.includes('Too many requests'))
            return 'Demasiados intentos. Espera unos minutos.';
        if (msg.includes('already registered') || msg.includes('already been registered'))
            return 'Este correo ya está registrado. Inicia sesión o usa otro correo.';
        if (msg.includes('Password should') || msg.includes('password'))
            return 'La contraseña debe tener al menos 8 caracteres';
        if (msg.includes('USER_INACTIVE') || msg.includes('desactivada'))
            return 'Tu cuenta está desactivada. Contacta al administrador.';
        if (msg.includes('company_name') || msg.includes('requerido'))
            return 'El nombre de empresa es requerido para registrarse.';
        if (msg.includes('Database error') || msg.includes('saving new user'))
            return `Error DB: ${msg}`;
        return msg || 'Error inesperado. Intenta de nuevo.';
    }

    // ── Login ────────────────────────────────────────────────────
    document.getElementById('form-login').addEventListener('submit', async e => {
        e.preventDefault();
        hideAlert();
        const email    = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        if (!email)    { showFieldError('login-email-err', 'Ingresa tu correo'); return; }
        if (!password) { showFieldError('login-password-err', 'Ingresa tu contraseña'); return; }
        clearFieldErrors('login-email-err', 'login-password-err');

        setLoading('btn-login', true);
        try {
            await authService.login(email, password);
            window.location.replace('/layouts');
        } catch (err) {
            showAlert(friendlyAuthError(err), 'error');
        } finally {
            setLoading('btn-login', false);
        }
    });

    // ── Register ─────────────────────────────────────────────────
    document.getElementById('form-register').addEventListener('submit', async e => {
        e.preventDefault();
        hideAlert();
        const name     = document.getElementById('reg-name').value.trim();
        const company  = document.getElementById('reg-company').value.trim();
        const email    = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;

        let valid = true;
        if (!name)               { showFieldError('reg-name-err', 'Ingresa tu nombre'); valid = false; }
        if (!email)              { showFieldError('reg-email-err', 'Ingresa tu correo'); valid = false; }
        if (password.length < 8) { showFieldError('reg-password-err', 'Mínimo 8 caracteres'); valid = false; }

        // Si NO es bootstrap, company es requerida
        if (!_isBootstrap && !company) {
            showFieldError('reg-company-err', 'Ingresa el nombre de tu empresa');
            valid = false;
        }
        if (!valid) return;

        setLoading('btn-register', true);
        try {
            const result = await authService.register(email, password, name, company || '');

            if (result?.session) {
                // Auto-confirm ON: redirigir inmediatamente
                const role = result.bootstrapRole;
                if (role === 'super_admin') {
                    showAlert('¡Sistema inicializado! Bienvenido, Super Admin. Redirigiendo…', 'success');
                    setTimeout(() => window.location.replace('/layouts'), 1500);
                } else {
                    window.location.replace('/layouts');
                }
            } else {
                showAlert('¡Cuenta creada! Revisa tu correo para confirmar tu cuenta antes de iniciar sesión.', 'success');
                document.getElementById('form-register').reset();
            }
        } catch (err) {
            showAlert(friendlyAuthError(err), 'error');
        } finally {
            setLoading('btn-register', false);
        }
    });

    // ── Forgot password ──────────────────────────────────────────
    document.getElementById('form-forgot').addEventListener('submit', async e => {
        e.preventDefault();
        hideAlert();
        const email = document.getElementById('forgot-email').value.trim();
        if (!email) { showAlert('Ingresa tu correo electrónico', 'error'); return; }

        setLoading('btn-forgot', true);
        try {
            await authService.forgotPassword(email);
            showAlert('Enlace enviado. Revisa tu correo.', 'success');
        } catch (err) {
            showAlert(err.message || 'Error al enviar el correo', 'error');
        } finally {
            setLoading('btn-forgot', false);
        }
    });

    // ── Init ──────────────────────────────────────────────────────
    let _isBootstrap = false;

    (async () => {
        try {
            await initSupabaseClient();
            await authService.init();

            if (authService.isLoggedIn) {
                window.location.replace('/layouts');
                return;
            }

            // Detectar si es primer registro (bootstrap)
            _isBootstrap = await authService.isBootstrapNeeded();
            if (_isBootstrap) {
                _showBootstrapBanner();
            }

            // Mostrar aviso de sesión expirada / cuenta inactiva
            const params = new URLSearchParams(window.location.search);
            if (params.get('reason') === 'inactive') {
                showAlert('Tu cuenta ha sido desactivada. Contacta al administrador.', 'error');
            } else if (params.get('reason') === 'error') {
                showAlert('Error de conexión con el servidor. Verifica tu red.', 'error');
            }

        } catch (err) {
            console.warn('Auth init error:', err.message);
        }
    })();

    function _showBootstrapBanner() {
        // Ajustar formulario de registro para bootstrap (sin empresa requerida)
        const heading = document.querySelector('#panel-register .auth-heading h1');
        const sub     = document.querySelector('#panel-register .auth-heading p');
        const compGrp = document.querySelector('#panel-register #reg-company')?.closest('.auth-form-group');
        const btnText = document.querySelector('#btn-register .btn-text');

        if (heading) heading.textContent = 'Configurar Super Admin';
        if (sub)     sub.textContent     = 'Primer inicio — crea el administrador del sistema';
        if (compGrp) {
            compGrp.querySelector('input').placeholder = 'Empresa (opcional)';
        }
        if (btnText) btnText.textContent = 'Inicializar sistema';

        // Mostrar banner informativo
        const banner = document.createElement('div');
        banner.className = 'auth-alert show success';
        banner.style.marginBottom = '1rem';
        banner.textContent = '⚡ Primera instalación: el primer usuario creado será Super Admin del sistema.';
        document.querySelector('#panel-register .auth-heading').after(banner);

        // Abrir tab de registro automáticamente
        switchTab('register');
    }
    </script>
</body>
</html>
